<style>
:root{--n:#0f172a;--t:#0f766e;--m:#64748b;--b:#e2e8f0;--r:#dc2626;--a:#d97706;--g:#16a34a;--bg:#f1f5f9}
*{box-sizing:border-box;margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}body{background:var(--bg);color:var(--n);font-size:14px;padding-bottom:60px}
header{background:var(--n);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
nav{background:#fff;display:flex;overflow-x:auto;border-bottom:1px solid var(--b)}nav button{border:0;background:0;padding:12px 14px;font-weight:600;color:var(--m);border-bottom:3px solid transparent;white-space:nowrap}nav button.on{color:var(--t);border-color:var(--t)}
main{max-width:1150px;margin:16px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.bar h3{flex:1}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle}th{background:#f8fafc;white-space:nowrap}
button,input,select{font-size:14px;padding:8px 10px;border-radius:6px;border:1px solid var(--b)}button{cursor:pointer;font-weight:600;background:#e2e8f0}.p{background:var(--t);color:#fff;border:0}.d{background:#fee2e2;color:var(--r);border:0}
.bd{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e2e8f0}.ok{background:#dcfce7;color:var(--g)}.wa{background:#fef3c7;color:var(--a)}.er{background:#fee2e2;color:var(--r)}.bl{background:#dbeafe;color:#2563eb}
#mb{display:none;position:fixed;inset:0;background:#0f172a99;z-index:9;align-items:center;justify-content:center;padding:12px}#mb.on{display:flex}#m{background:#fff;border-radius:12px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.g2 label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600}.row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--b)}.row>span{flex:1}
.m{color:var(--m);font-size:12px}.th{object-fit:contain;border-radius:6px;background:#fff;border:1px solid var(--b);flex:none}.tn{display:flex;gap:10px;align-items:center}input[type=checkbox]{width:22px;height:22px}
#lg{display:none;position:fixed;inset:0;background:var(--n);z-index:50;align-items:center;justify-content:center;padding:16px}#lg.on{display:flex}
#lb{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;text-align:center;color:#fff}#lb.on{display:flex}#lb img{max-width:92vw;max-height:78vh;min-width:260px;background:#fff;border-radius:10px;object-fit:contain}.th[src]{cursor:zoom-in}
@media(max-width:640px){.g2{grid-template-columns:1fr}}

function verM(id){const d=S.deps.find(x=>x.id===id);window.cur=d;M(`<h3>Stage 2 · Verify on site — ${h(d.site)}</h3>${d.lines.map(l=>`<div class="row"><input type="checkbox" class="vf">${th(it(l.sku))}<span>${l.qty}× ${h(it(l.sku).name)}</span></div>`).join('')}<div class="g2"><label>Site completion photos (required)<input type="file" id="ph" accept="image/*" multiple capture="environment"></label></div><p class="m">Only file names are recorded in v1. Connect Supabase Storage to keep the images.</p><button onclick="X()">Cancel</button> <button class="p" onclick="doVer()">Lock in deployment</button>`)}
function doVer(){const d=cur,f=$('#ph').files;if([...document.querySelectorAll('.vf')].some(c=>!c.checked))return say('Tick every item as verified on site.');if(!f.length)return say('Add at least one site photo.');d.lines.forEach(l=>l.v=1);d.photos=[...f].map(x=>x.name);d.status='Live';log('Site verified',`${d.id}, ${f.length} photo(s)`);done()}
function tdM(id){const d=S.deps.find(x=>x.id===id);window.cur=d;const ls=d.lines.filter(l=>it(l.sku).type!=='Consumable');M(`<h3>Plan teardown — ${h(d.site)}</h3><div class="g2"><label>Teardown date<input type="date" id="td" value="${d.end}"></label></div><p class="m">Nothing moves yet. Stock stays on the site until you press Dismantle / return. Pick where each item goes next; the forecast uses this.</p>${ls.map(l=>`<div class="row">${th(it(l.sku))}<span>${l.qty}× ${h(it(l.sku).name)}</span>${dsel('tdl',l.to||Z(d.zone),d.id)}</div>`).join('')}<div style="margin-top:12px"><button onclick="X()">Cancel</button> <button class="p" onclick="saveTd()">Save plan</button></div>`)}
function saveTd(){const d=cur,ls=d.lines.filter(l=>it(l.sku).type!=='Consumable'),old=d.end;document.querySelectorAll('.tdl').forEach((e,n)=>ls[n].to=e.value);d.end=$('#td').value;log('Teardown planned',`${d.id} ${d.site}: ${old}→${d.end}; ${ls.map(l=>l.qty+'× '+it(l.sku).name+' → '+LB(l.to||Z(d.zone))).join('; ')}`);done()}
function retM(id){const d=S.deps.find(x=>x.id===id);window.cur=d;M(`<h3>Dismantle / return — ${h(d.site)}</h3>${d.lines.filter(l=>it(l.sku).type!=='Consumable').map((l,n)=>`<div class="row">${th(it(l.sku))}<span>${h(it(l.sku).name)}<div class="m">${l.qty} out</div>${dsel('rt',l.to||Z(d.zone),d.id)}</span><label class="m">Good<input type="number" class="rg" min="0" value="${l.qty}" style="width:64px"></label><label class="m">Damaged<input type="number" class="rd" min="0" value="0" style="width:64px"></label><label class="m">Lost<input type="number" class="rl" min="0" value="0" style="width:64px"></label></div>`).join('')}<p class="m">Choose where each item goes now (a zone, or straight to another live site). Consumables are not returned. Damage goes to pending until Jojo/Karsten approve it.</p><button onclick="X()">Cancel</button> <button class="p" onclick="doRet()">Complete return</button>`)}
function doRet(){const d=cur,ls=d.lines.filter(l=>it(l.sku).type!=='Consumable'),g=[...document.querySelectorAll('.rg')],dm=[...document.querySelectorAll('.rd')],lo=[...document.querySelectorAll('.rl')];
for(let n=0;n<ls.length;n++)if(+g[n].value+ +dm[n].value+ +lo[n].value!==ls[n].qty)return say(`${it(ls[n].sku).name}: good + damaged + lost must equal ${ls[n].qty}`);
ls.forEach((l,n)=>{const i=it(l.sku);const t=document.querySelectorAll('.rt')[n].value,gq=+g[n].value;i.pend+= +dm[n].value;if(t[0]==='z')i.loc[t.slice(2)]=(i.loc[t.slice(2)]||0)+gq;else{const tg=S.deps.find(x=>x.id===t.slice(2)),e=tg.lines.find(x=>x.sku===l.sku);e?e.qty+=gq:tg.lines.push({sku:l.sku,qty:gq,p:1,v:0})}mv(l.sku,gq,SD(d.id),t,d.id,'return');mv(l.sku,+dm[n].value,SD(d.id),'x:quarantine',d.id,'damaged');mv(l.sku,+lo[n].value,SD(d.id),'x:lost',d.id,'lost');if(+lo[n].value)log('Lost',`${lo[n].value}× ${i.name} (${d.id})`)});d.lines.filter(l=>it(l.sku).type==='Consumable').forEach(l=>mv(l.sku,l.qty,SD(d.id),'x:consumed',d.id,'used'));d.status='Returned';log('Dismantled',`${d.id} ${d.site}`);done()}
function swapM(id){const d=S.deps.find(x=>x.id===id);window.cur=d;const o=[['','—'],...S.items.filter(i=>i.brand==='Universal'||i.brand===d.brand).map(i=>[i.sku,i.name])],r=n=>`<div class="row">${sel('sk'+n,o)} <input type="number" id="sq${n}" min="0" placeholder="qty" style="width:70px"></div>`;
M(`<h3>Site swap — ${h(d.site)}</h3><div class="g2"><label>Stock location${zsel('sz',d.zone)}</label></div><p class="m">Currently on site:</p><div class="tn" style="flex-wrap:wrap">${d.lines.map(l=>`<div class="tn">${th(it(l.sku),36)}<span class="m">${l.qty}× ${h(it(l.sku).name)}</span></div>`).join('')||'<span class="m">nothing logged</span>'}</div><b>Taken OFF site (back to storage)</b>${[0,1,2].map(r).join('')}<b>Put ON site (from storage)</b>${[3,4,5].map(r).join('')}<p class="m">One transaction, one audit entry.</p><button onclick="X()">Cancel</button> <button class="p" onclick="doSwap()">Apply swap</button>`)}
function doSwap(){const d=cur,z=$('#sz').value,get=n=>({sku:$('#sk'+n).value,qty:+$('#sq'+n).value||0}),rm=[0,1,2].map(get).filter(x=>x.sku&&x.qty),ad=[3,4,5].map(get).filter(x=>x.sku&&x.qty);
for(const x of rm){const l=d.lines.find(l=>l.sku===x.sku);if(!l||l.qty<x.qty)return say(`${it(x.sku).name}: only ${l?l.qty:0} on this site`)}for(const x of ad)if(stk(x,z)<x.qty)return say(`${it(x.sku).name}: only ${stk(x,z)} in ${zn(z)}`);
rm.forEach(x=>{const l=d.lines.find(l=>l.sku===x.sku);l.qty-=x.qty;it(x.sku).loc[z]=(it(x.sku).loc[z]||0)+x.qty;mv(x.sku,x.qty,SD(d.id),Z(z),d.id,'swap-off')});d.lines=d.lines.filter(l=>l.qty>0);
ad.forEach(x=>{it(x.sku).loc[z]-=x.qty;mv(x.sku,x.qty,Z(z),SD(d.id),d.id,'swap-on');const l=d.lines.find(l=>l.sku===x.sku);l?l.qty+=x.qty:d.lines.push({sku:x.sku,qty:x.qty,p:1,v:1})});log('Site swap',`${d.id}: off ${rm.map(x=>x.qty+'× '+it(x.sku).name).join(', ')||'-'} / on ${ad.map(x=>x.qty+'× '+it(x.sku).name).join(', ')||'-'}`);done()}
// Booking + floor calculator
function kit(c,r,b){const L=b==='Jaecoo'?[['JAE-TILE-2L',c*r]]:[['FLR-V3P-TLG',c*r],['FLR-V3P-RMPM',c+r],['FLR-V3P-RMPF',c+r],['FLR-V3P-CRN',4],['FLR-V3P-CDST',c+r],['FLR-V3P-CDED',4],['FLR-V3P-CDCR',1]];return[...L,['ACC-WHL-CHK',8],['CON-WYS-STK',4]].map(([sku,qty])=>({sku,qty}))}
function newDep(){K=[];M(`<h3>New booking</h3><div class="g2"><label>Site<input id="ns"></label><label>Brand${sel('nb',['Zeekr','Jaecoo','Universal'].map(x=>[x,x]))}</label><label>Start<input type="date" id="nst"></label><label>End (return)<input type="date" id="ne"></label><label>Lead crew<input id="nc"></label><label>Pack from${zsel('nz','z1')}</label><label>Floor columns (400mm tiles)<input type="number" id="ncol" value="10" min="2"></label><label>Floor rows<input type="number" id="nrow" value="10" min="2"></label></div><button onclick="K=kit(+$('#ncol').value,+$('#nrow').value,$('#nb').value);kl()">Calculate floor & build kit</button><p class="m">Ramps and Cordlink strips = columns + rows (minimum). A layout with an extra run needs another strips row: edit the quantity below. 4 corners, 4 edges, 1 cross corner, 8 chocks, 4 stickers added.</p><div id="kl"></div><div style="margin-top:12px"><button onclick="X()">Cancel</button> <button class="p" onclick="saveDep()">Reserve (checks stock)</button></div>`)}
function kl(){$('#kl').innerHTML=K.map((l,n)=>`<div class="row">${th(it(l.sku))}<span>${h(it(l.sku).name)}</span><input type="number" min="0" value="${l.qty}" style="width:70px" onchange="K[${n}].qty=+this.value"></div>`).join('')+`<div class="row">${sel('ax',[['','+ Add item…'],...S.items.filter(i=>i.brand==='Universal'||i.brand===$('#nb').value).map(i=>[i.sku,i.name])])}<button onclick="if($('#ax').value){K.push({sku:$('#ax').value,qty:1});kl()}">Add</button></div>`}
async function saveDep(){const d={id:newId(),site:$('#ns').value.trim(),brand:$('#nb').value,start:$('#nst').value,end:$('#ne').value,crew:$('#nc').value,zone:$('#nz').value,status:'Reserved',lines:K.filter(l=>l.qty>0),photos:[]};
if(!d.site||!d.start||!d.end||d.end<=d.start)return say('Site, and an end date after the start date, are required.');if(!d.lines.length&&!await ask('No items yet. Create the site anyway? (You can add items later with Edit.)','Create site'))return;
const off=d.lines.filter(l=>{const b=it(l.sku).brand;return b!=='Universal'&&b!==d.brand});if(off.length)return say('Wrong-brand items: '+off.map(l=>it(l.sku).name).join(', '));
const c=conflicts(d);if(c.length&&!await ask('Stock conflicts:\n'+c.join('\n')+'\n\nReserve anyway?','Reserve anyway'))return;S.deps.unshift(d);log('Reserved',`${d.id} ${d.site}`);done()}
// Catalog / zones
function adjM(s){const i=it(s);window.cur=i;window.np=null;M(`<h3>Edit item</h3><div class="tn" style="margin-bottom:8px">${th(i,64)}<div><input type="file" id="af" accept="image/*" onchange="pickPh(this)"><div class="m">Upload your own photo (optional)${i.img?' · <a href="#" onclick="cur.img=\'\';X();adjM(cur.sku);return false">use cheat-sheet photo</a>':''}</div></div></div><div class="g2"><label>Name<input id="an" value="${h(i.name)}"></label><label>Aliases / other names<input id="aa" value="${h(i.alias)}"></label><label>Brand${sel('ab',['Zeekr','Jaecoo','Universal'].map(x=>[x,x]),i.brand)}</label><label>Generation<input id="ag" value="${h(i.gen)}"></label><label>Type${sel('at',['Reusable','Serialized','Consumable'].map(x=>[x,x]),i.type)}</label><label>Min threshold<input type="number" id="am" value="${i.min}"></label>${S.zones.map(z=>`<label>Qty in ${h(z.name)}<input type="number" min="0" class="az" data-z="${z.id}" value="${i.loc[z.id]||0}"></label>`).join('')}<label>Reason for change<input id="ar" placeholder="e.g. stocktake, correction"></label></div><button class="d" onclick="delItem()">Delete SKU</button> <button onclick="X()">Cancel</button> <button class="p" onclick="doAdj()">Save</button>`)}
function pickPh(e){const f=e.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,240,240);const k=Math.min(240/im.width,240/im.height);x.drawImage(im,(240-im.width*k)/2,(240-im.height*k)/2,im.width*k,im.height*k);window.np=c.toDataURL('image/jpeg',.7)};im.src=URL.createObjectURL(f)}
function doAdj(){const i=cur,r=[];document.querySelectorAll('.az').forEach(e=>{const v=Math.max(0,+e.value||0);const o=i.loc[e.dataset.z]||0;if(v!==o){r.push(`${zn(e.dataset.z)} ${o}→${v}`);v>o?mv(i.sku,v-o,'x:ext',Z(e.dataset.z),'','stocktake +'):mv(i.sku,o-v,Z(e.dataset.z),'x:lost','','stocktake −')}i.loc[e.dataset.z]=v});
[['name','an'],['alias','aa'],['brand','ab'],['gen','ag'],['type','at']].forEach(([k,e])=>{if(i[k]!==$('#'+e).value){r.push(`${k}: ${i[k]}→${$('#'+e).value}`);i[k]=$('#'+e).value}});i.min=+$('#am').value||0;if(np){i.img=np;r.push('photo updated')}
log('Item edited',`${i.sku}: ${r.join('; ')||'no change'} (${$('#ar').value||'no reason'})`);done()}
function depM(id){const d=S.deps.find(x=>x.id===id);window.cur=d;const o=OUT.includes(d.status),ed=d.status!=='Returned',br=['Zeekr','Jaecoo','Universal'].map(x=>[x,x]);
M(`<h3>Edit site — ${h(d.id)} ${bd(d.status,'bl')}</h3><p class="m">${o?'Items are out of '+h(zn(d.zone))+'. Changing a quantity or adding an item moves stock automatically.':d.status==='Reserved'?'Reserved: no stock has moved yet. Stock moves when you pack & dispatch.':'Returned: history only.'}</p>${ed?`<div class="g2"><label>Site<input id="es" value="${h(d.site)}"></label><label>Brand${sel('eb',br,d.brand)}</label><label>Start<input type="date" id="est" value="${d.start}"></label><label>End<input type="date" id="ee" value="${d.end}"></label><label>Crew<input id="ec" value="${h(d.crew||'')}"></label>${d.status==='Reserved'?`<label>Pack from${zsel('ez',d.zone)}</label>`:''}</div>${d.lines.map(l=>`<div class="row">${th(it(l.sku))}<span>${h(it(l.sku).name)}</span><input type="number" min="0" class="el" value="${l.qty}" style="width:70px"></div>`).join('')||'<p class="m">No items on this site yet.</p>'}<div class="row">${sel('ea',[['','+ Add item…'],...S.items.filter(i=>i.brand==='Universal'||i.brand===d.brand).map(i=>[i.sku,i.name])])}<input type="number" id="eaq" min="1" value="1" style="width:70px"></div>`:''}<div style="margin-top:12px"><button class="d" onclick="delDep()">Delete site</button> <button onclick="X()">Close</button> ${ed?'<button class="p" onclick="saveEdit()">Save</button>':''}</div>`)}
function saveEdit(){const d=cur,o=OUT.includes(d.status),z=d.zone,nb=$('#eb').value,N={},O={};d.lines.forEach(l=>O[l.sku]=(O[l.sku]||0)+l.qty);
document.querySelectorAll('.el').forEach((e,n)=>{const k=d.lines[n].sku;N[k]=(N[k]||0)+Math.max(0,+e.value||0)});const ad=$('#ea').value,aq=+$('#eaq').value||0;if(ad&&aq>0)N[ad]=(N[ad]||0)+aq;
const wb=Object.keys(N).filter(k=>N[k]>0&&it(k).brand!=='Universal'&&it(k).brand!==nb);if(wb.length)return say('Wrong-brand items for '+nb+': '+wb.map(k=>it(k).name).join(', '));
if(o){const sh=Object.keys(N).filter(k=>N[k]-(O[k]||0)>(it(k).loc[z]||0));if(sh.length)return say('Not enough in '+zn(z)+': '+sh.map(k=>`${it(k).name} (need ${N[k]-(O[k]||0)} more, have ${it(k).loc[z]||0})`).join('; '));
Object.keys(N).forEach(k=>{const dl=N[k]-(O[k]||0);if(dl>0){it(k).loc[z]-=dl;mv(k,dl,Z(z),SD(d.id),d.id,'site edit +')}else if(dl<0){it(k).loc[z]=(it(k).loc[z]||0)-dl;mv(k,-dl,SD(d.id),Z(z),d.id,'site edit −')}})}
if(d.status==='Reserved')d.zone=$('#ez').value;d.site=$('#es').value;d.brand=nb;d.start=$('#est').value;d.end=$('#ee').value;d.crew=$('#ec').value;
d.lines=Object.keys(N).filter(k=>N[k]>0).map(k=>{const x=d.lines.find(l=>l.sku===k);return x?{...x,qty:N[k]}:o?{sku:k,qty:N[k],p:1,v:d.status==='Live'?1:0}:{sku:k,qty:N[k]}});log('Site edited',`${d.id} ${d.site}: ${Object.keys(N).filter(k=>(O[k]||0)!==N[k]).map(k=>`${it(k).name} ${O[k]||0}→${N[k]}`).join('; ')||'details only'}`);done()}
async function delDep(){const d=cur,o=OUT.includes(d.status);if(!await ask(o?`Delete ${d.site}? Everything on it goes back to ${zn(d.zone)} (consumables count as used).`:`Delete ${d.site}?`,'Delete site'))return;
if(o)d.lines.forEach(l=>{const i=it(l.sku);if(i.type==='Consumable')mv(l.sku,l.qty,SD(d.id),'x:consumed',d.id,'site deleted');else{i.loc[d.zone]=(i.loc[d.zone]||0)+l.qty;mv(l.sku,l.qty,SD(d.id),Z(d.zone),d.id,'site deleted')}});
S.deps=S.deps.filter(x=>x!==d);log('Site deleted',`${d.id} ${d.site}`);done()}
function conf(id,st){const a=S.audit.find(x=>x.id===id);a.st=st;a.by=LSX.mg_who;a.at=new Date().toISOString().slice(0,16).replace('T',' ');save();render()}
function confAll(){S.audit.forEach(a=>{if((a.st||'Pending')==='Pending'){a.st='Confirmed';a.by=LSX.mg_who;a.at=new Date().toISOString().slice(0,16).replace('T',' ')}});save();render()}
async function fresh(){if(!await ask('Start fresh: set ALL stock to 0 and delete ALL site records? Catalog and photos are kept. Use this before entering your real counts.','Start fresh'))return;S.items.forEach(i=>{Object.keys(i.loc).forEach(z=>i.loc[z]=0);i.pend=0});S.deps=[];S.mv=[];log('Start fresh','Demo stock and sites cleared');save();render()}
async function delItem(){const i=cur;if(S.deps.some(d=>d.status!=='Returned'&&d.lines.some(l=>l.sku===i.sku)))return say('Item is on an open deployment.');if(!await ask('Delete '+i.name+'?','Delete item'))return;S.items=S.items.filter(x=>x!==i);log('Deleted SKU',i.sku);done()}
function dmg(s,ok){const i=it(s),z=S.zones[0].id;if(ok){mv(s,i.pend,'x:quarantine','x:written-off','','write-off');log('Damage approved',`${i.pend}× ${i.name} written off`)}else{i.loc[z]=(i.loc[z]||0)+i.pend;mv(s,i.pend,'x:quarantine',Z(z),'','damage rejected');log('Damage rejected',`${i.pend}× ${i.name} back to ${zn(z)}`)}i.pend=0;save();render()}
function itemM(){M(`<h3>New item</h3><div class="g2"><label>SKU<input id="is"></label><label>Name<input id="in"></label><label>Aliases<input id="ia"></label><label>Brand${sel('ib',['Zeekr','Jaecoo','Universal'].map(x=>[x,x]))}</label><label>Type${sel('it',['Reusable','Serialized','Consumable'].map(x=>[x,x]))}</label><label>Generation<input id="ig" value="V3 Plus"></label><label>Min<input type="number" id="im" value="0"></label><label>Thumbnail URL<input id="iu"></label></div><button onclick="X()">Cancel</button> <button class="p" onclick="addItem()">Create</button>`)}
function addItem(){const s=$('#is').value.trim().toUpperCase();if(!s||!$('#in').value||it(s))return say('Unique SKU and name required.');S.items.unshift({sku:s,name:$('#in').value,alias:$('#ia').value,cat:CAT[s.slice(0,3)]||'Other',gen:$('#ig').value,brand:$('#ib').value,type:$('#it').value,min:+$('#im').value||0,img:$('#iu').value,pend:0,loc:{}});log('New SKU',s);done()}
function zoneM(id){const z=S.zones.find(x=>x.id===id)||{name:'',addr:''};window.zid=id;M(`<h3>${id?'Edit':'New'} storage zone</h3><div class="g2"><label>Name / unit no.<input id="zn" value="${h(z.name)}"></label><label>Address / notes<input id="za" value="${h(z.addr)}"></label></div><button onclick="X()">Cancel</button> <button class="p" onclick="saveZone()">Save</button>`)}
function saveZone(){let z=S.zones.find(x=>x.id===zid);if(!z){z={id:'z'+Date.now().toString(36)};S.zones.push(z)}z.name=$('#zn').value||'Unnamed';z.addr=$('#za').value;log('Zone saved',z.name);done()}
function xferM(){M(`<h3>Move stock between zones</h3><div class="g2"><label>Item${sel('xi',S.items.map(i=>[i.sku,i.name]))}</label><label>Qty<input type="number" id="xq" min="1" value="1"></label><label>From${zsel('xf','zt')}</label><label>To${zsel('xt','z1')}</label></div><p class="m">Pallet arrives → add stock to Inbound Transit via Stocktake, then move it to the unit once unpacked.</p><button onclick="X()">Cancel</button> <button class="p" onclick="doX()">Move</button>`)}
function doX(){const i=it($('#xi').value),f=$('#xf').value,t=$('#xt').value,q=+$('#xq').value;if(f===t||q<1||(i.loc[f]||0)<q)return say('Check zones and quantity (only '+(i.loc[f]||0)+' in source).');i.loc[f]-=q;i.loc[t]=(i.loc[t]||0)+q;mv(i.sku,q,Z(f),Z(t),'','transfer');log('Stock moved',`${q}× ${i.name}: ${zn(f)} → ${zn(t)}`);done()}
boot();
</script>

#ai-head{background:var(--n);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
#ai-head button{background:0;border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
#ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.aim{max-width:88%;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.aim.u{background:var(--t);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.aim.a{background:#f1f5f9;color:var(--n);align-self:flex-start;border-bottom-left-radius:3px}
#ai-typing{font-size:12px;color:var(--m);padding:4px 14px;display:none}
#ai-foot{display:flex;gap:6px;padding:10px;border-top:1px solid var(--b)}
#ai-inp{flex:1;border-radius:8px;padding:8px 10px;font-size:13px;border:1px solid var(--b);resize:none;height:36px;min-height:36px;overflow:hidden}
#ai-send{background:var(--t);color:#fff;border:0;border-radius:8px;padding:0 14px;font-weight:600;cursor:pointer;white-space:nowrap}
#ai-send:disabled{opacity:.5;cursor:default}
</style>

<button id="ai-btn" onclick="aiToggle()" title="Ask AI Assistant">💬</button>
<div id="ai-panel">
  <div id="ai-head">
    <span>🤖 Magidigi Assistant</span>
    <button onclick="aiToggle()">×</button>
  </div>
  <div id="ai-msgs">
    <div class="aim a">Hi! I'm your Magidigi inventory assistant. Ask me how to use the app or anything about the current stock and deployments.</div>
  </div>
  <div id="ai-typing">Thinking…</div>
  <div id="ai-foot">
    <textarea id="ai-inp" placeholder="Ask a question…" onkeydown="aiKey(event)"></textarea>
    <button id="ai-send" onclick="aiSend()">Send</button>
  </div>
</div>

<script>
var aiHistory=[];
function aiToggle(){document.getElementById('ai-panel').classList.toggle('on')}
function aiKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend()}}
function aiAddMsg(text,role){
  var msgs=document.getElementById('ai-msgs');
  var d=document.createElement('div');
  d.className='aim '+role;
  d.textContent=text;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}
async function aiSend(){
  var inp=document.getElementById('ai-inp');
  var send=document.getElementById('ai-send');
  var msg=inp.value.trim();
  if(!msg||send.disabled)return;
  inp.value='';
  aiAddMsg(msg,'u');
  aiHistory.push({role:'user',content:msg});
  send.disabled=true;
  document.getElementById('ai-typing').style.display='block';
  var ctx=JSON.stringify({
    zones:S.zones.map(function(z){return{id:z.id,name:z.name}}),
    items:S.items.map(function(i){return{sku:i.sku,name:i.name,type:i.type,brand:i.brand,gen:i.gen,min:i.min,locations:i.loc,pendingDamage:i.pend||0}}),
    deployments:S.deps.map(function(d){return{id:d.id,site:d.site,brand:d.brand,start:d.start,end:d.end,status:d.status,crew:d.crew,itemLines:d.lines.length}})
  },null,2);
  try{
    var res=await fetch('/.netlify/functions/chat',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({messages:aiHistory.slice(-10),context:ctx})
    });
    var data=await res.json();
    var reply=data.reply||'Sorry, I could not get a response.';
    aiHistory.push({role:'assistant',content:reply});
    aiAddMsg(reply,'a');
  }catch(e){
    var err='Connection error. Please try again.';
    aiHistory.push({role:'assistant',content:err});
    aiAddMsg(err,'a');
  }
  send.disabled=false;
  document.getElementById('ai-typing').style.display='none';
}
</script>
</body>
</html>
